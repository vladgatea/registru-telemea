<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analize Contraprobe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#4A148C;--purple-mid:#6A1B9A;--purple-light:#8E24AA;--purple-bg:#F3E5F5;--purple-bg2:#FAF0FF;
  --green:#2E7D32;--green-bg:#E8F5E9;
  --red:#C62828;--red-bg:#FFEBEE;
  --orange:#E65100;--orange-bg:#FFF3E0;
  --blue:#1565C0;--blue-bg:#E3F2FD;
  --gray-1:#F7F8FA;--gray-2:#ECEEF2;--gray-3:#C8CDD6;--gray-4:#7A8494;--gray-5:#3D4452;
  --dark:#1A1D23;--white:#FFFFFF;
  --radius:10px;--shadow:0 2px 10px rgba(0,0,0,0.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-1);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}

.hdr{background:var(--purple-mid);color:white;padding:14px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.hdr-row{display:flex;align-items:center;gap:12px}
.hdr-icon{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr-title{font-size:16px;font-weight:700;flex:1}
.hdr-sub{font-size:11px;opacity:0.75;margin-top:1px}
.hdr-btns{display:flex;gap:8px;margin-top:10px}
.hdr-btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.hdr-btn.white{background:white;color:var(--purple-mid)}
.hdr-btn.outline{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3)}

.main{padding:16px;max-width:860px;margin:0 auto}

.card{background:white;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-hdr{padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;gap:8px}
.card-hdr.purple{background:var(--purple-bg2);color:var(--purple-mid)}
.card-hdr.orange{background:var(--orange-bg);color:var(--orange)}
.card-body{padding:14px 16px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;color:var(--gray-4);text-transform:uppercase;letter-spacing:0.4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--gray-2);border-radius:8px;font-size:15px;color:var(--dark);background:var(--gray-1);outline:none;appearance:none;-webkit-appearance:none;transition:all 0.2s;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple-mid);background:white;box-shadow:0 0 0 3px rgba(106,27,154,0.1)}
.field input.ok{border-color:var(--green);background:#F1F8E9}
.field input.bad{border-color:var(--red);background:var(--red-bg)}
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--gray-4);pointer-events:none;font-size:13px}
select{padding-right:30px;cursor:pointer}

/* PH STATUS */
.ph-status{font-size:11px;font-weight:700;margin-top:4px}
.ph-ok{color:var(--green)}
.ph-bad{color:var(--red)}

/* GREUTATE */
.gr-info{font-size:11px;color:var(--gray-4);margin-top:4px}

.conf-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.conf-CONFORM{background:var(--green-bg);color:var(--green)}
.conf-NECONFORM{background:var(--red-bg);color:var(--red)}
.conf-NA{background:var(--gray-2);color:var(--gray-4)}

/* ADD BTN */
.btn-add{width:100%;padding:14px;background:var(--purple-mid);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.2s;margin-bottom:14px}
.btn-add:hover{background:var(--purple-light)}
.btn-add:disabled{background:var(--gray-3);cursor:not-allowed}

/* SAVE BTN */
.btn-save{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.2s;margin-bottom:14px}
.btn-save:hover{background:#388E3C}
.btn-save:disabled{background:var(--gray-3);cursor:not-allowed}

.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* RECORD CARD */
.rec-card{border:1.5px solid var(--gray-2);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--gray-1);transition:border-color 0.2s}
.rec-card.saved{border-color:#A5D6A7;background:#F9FFF9}
.rec-card.unsaved{border-color:#FFCC80;background:#FFFDF0}
.rec-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-meta{font-size:12px;color:var(--gray-4);margin-bottom:8px}
.rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.chip-gray{background:var(--gray-2);color:var(--gray-5)}
.chip-ok{background:var(--green-bg);color:var(--green)}
.chip-bad{background:var(--red-bg);color:var(--red)}
.chip-orange{background:var(--orange-bg);color:var(--orange)}
.rec-obs{font-size:12px;color:var(--gray-4);font-style:italic;margin-top:4px}
.rec-actions{display:flex;gap:8px;margin-top:10px}
.rec-actions button{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.btn-edit-rec{background:var(--blue-bg);color:var(--blue)}
.btn-del-rec{background:var(--red-bg);color:var(--red)}

/* REGISTRU HEADER */
.reg-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.reg-count{font-size:12px;color:var(--gray-4)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:white;padding:11px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 4px 20px rgba(0,0,0,0.25);max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}

.empty-state{padding:30px;text-align:center;color:var(--gray-4);font-size:14px}
.bottom-spacer{height:60px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="hdr-icon">🧪</div>
    <div style="flex:1">
      <div class="hdr-title">Analize Contraprobe</div>
      <div class="hdr-sub">Registru zilnic · Laborator</div>
    </div>
  </div>
  <div class="hdr-btns">
    <button class="hdr-btn white" onclick="exportExcel()">📊 Excel</button>
    <button class="hdr-btn outline" onclick="window.print()">🖨 Print</button>
  </div>
</div>

<div class="main">

  <!-- FORMULAR -->
  <div class="card">
    <div class="card-hdr purple">🧫 CONTRAPROBA NOUĂ</div>
    <div class="card-body">

      <div class="grid-3" style="margin-bottom:12px">
        <div class="field">
          <label>Data <span style="color:red">*</span></label>
          <input type="date" id="f_data" />
        </div>
        <div class="field">
          <label>Articol <span style="color:red">*</span></label>
          <div class="select-wrap">
            <select id="f_articol" onchange="onArticolChange()">
              <option value="">— Selectează —</option>
              <option>DLF 350G</option><option>PDA 300G</option><option>BB FRA</option>
              <option>MARUNTITA</option><option>BB 4X60DLF</option><option>BB PDA 2KG</option>
              <option>DLF 250G</option><option>BB DLF 2KG</option><option>BB OAIE 100% PDA</option>
              <option>BV 400G</option><option>TVPS 375 G</option><option>TVPS 800G</option>
              <option>CAS V 300G</option><option>CAS V+O 300G</option><option>CAS V MV</option>
              <option>CAS V+O MV</option><option>BULGARAS</option><option>TV MOLD 800G</option>
              <option>TOPS 800G</option><option>TCPS 800G</option><option>BV 5KG</option>
              <option>CAS V MP</option><option>TOPS</option><option>TCPS</option>
              <option>TV DEG 4KG</option><option>TV</option><option>BB 5X60DLF</option>
              <option>TVPS 4KG</option><option>TV MOLD 4KG</option><option>TV+O 4KG</option>
              <option>TV+C 4KG</option><option>CAS O 100%</option><option>CAS V+O MP</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Lot <span style="color:red">*</span></label>
          <input type="text" id="f_lot" placeholder="ex: 2600501" />
        </div>
      </div>

      <div class="grid-3" style="margin-bottom:12px">
        <div class="field">
          <label>Data expirare</label>
          <input type="date" id="f_exp" />
        </div>
        <div class="field">
          <label>Greutate (g) <span style="color:red">*</span></label>
          <input type="number" id="f_greutate" placeholder="ex: 350" step="0.1" oninput="checkGreutate()" />
          <div class="gr-info" id="gr_info"></div>
        </div>
        <div class="field">
          <label>pH</label>
          <input type="number" id="f_ph" placeholder="ex: 4.8" step="0.01" oninput="checkPH()" />
          <div class="ph-status" id="ph_status"></div>
        </div>
      </div>

      <div class="grid-3" style="margin-bottom:12px">
        <div class="field">
          <label>Textură</label>
          <input type="text" id="f_textura" placeholder="ex: fină, granjoasă" />
        </div>
        <div class="field">
          <label>Miros</label>
          <input type="text" id="f_miros" placeholder="ex: fără miros" />
        </div>
        <div class="field">
          <label>Gust</label>
          <input type="text" id="f_gust" placeholder="ex: specific, amar" />
        </div>
      </div>

      <div class="grid-3" style="margin-bottom:12px">
        <div class="field">
          <label>Efectuat</label>
          <input type="text" id="f_efect" placeholder="Nume laborant" />
        </div>
        <div class="field">
          <label>Verificat</label>
          <input type="text" id="f_verif" placeholder="Nume verificator" />
        </div>
      </div>

      <div class="field" style="margin-bottom:0">
        <label>Observații</label>
        <textarea id="f_obs" placeholder="Observații suplimentare..." style="min-height:60px;resize:vertical"></textarea>
      </div>
    </div>
  </div>

  <button class="btn-add" id="addBtn" onclick="adaugaContraproba()">
    ✅ Adaugă contraproba în registru
  </button>

  <!-- REGISTRU -->
  <div class="card">
    <div class="card-hdr orange">
      <div class="reg-hdr" style="width:100%">
        <span>📋 REGISTRU CONTRAPROBE — SESIUNEA CURENTĂ</span>
        <span class="reg-count" id="regCount">0 înregistrări</span>
      </div>
    </div>
    <div class="card-body" id="registruBody">
      <div class="empty-state">Nicio contraproba adăugată încă.</div>
    </div>
  </div>

  <!-- SAVE TO SHEETS -->
  <div class="card">
    <div class="card-hdr green">📊 SALVARE GOOGLE SHEETS</div>
    <div class="card-body">
      <p style="font-size:13px;color:var(--gray-4);margin-bottom:14px;">Trimite toate contraprobele din sesiunea curentă direct în registrul Google Sheets.</p>
      <button class="btn-save" id="saveBtn" onclick="salveazaInSheets()">
        <span id="saveTxt">📤 Salvează în Google Sheets</span>
        <div class="spinner" id="saveSpin"></div>
      </button>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSi7JpF6q0LPK1zP3ue3slKze92dksT-lKM63SwKrMs8gQI953bsOcsCKqPwB2xWqY/exec';

const PH_STANDARDE = {
  'DLF 350G':[4.6,4.9],'PDA 300G':[4.5,4.9],'BB FRA':[4.5,4.9],'MARUNTITA':[4.5,4.9],
  'BB 4X60DLF':[4.6,4.9],'BB PDA 2KG':[4.5,4.9],'DLF 250G':[4.6,4.9],'BB DLF 2KG':[4.6,4.9],
  'BB OAIE 100% PDA':[4.4,4.9],'BV 400G':[4.5,4.6],'TVPS 375 G':[4.6,4.9],'TVPS 800G':[4.6,4.9],
  'CAS V 300G':[5.3,5.5],'CAS V+O 300G':[5.2,5.5],'CAS V MV':[5.3,5.5],'CAS V+O MV':[5.2,5.5],
  'BULGARAS':[5.0,5.4],'TV MOLD 800G':[4.6,4.9],'TOPS 800G':[4.6,4.9],'TCPS 800G':[4.6,4.9],
  'BV 5KG':[4.5,4.6],'CAS V MP':[5.3,5.5],'TOPS':[4.6,4.9],'TCPS':[4.6,4.9],
  'TV DEG 4KG':[4.6,4.9],'TV':[4.6,4.9],'BB 5X60DLF':[4.6,4.9],'TVPS 4KG':[4.6,4.9],
  'TV MOLD 4KG':[4.6,4.9],'TV+O 4KG':[4.6,4.9],'TV+C 4KG':[4.6,4.9],'CAS O 100%':[5.1,5.4],
  'CAS V+O MP':[5.2,5.5],
};
const GREUTATI = {
  'DLF 350G':350,'PDA 300G':300,'BB 4X60DLF':300,'BB PDA 2KG':2000,'DLF 250G':250,
  'BB DLF 2KG':2000,'BV 400G':400,'TVPS 375 G':375,'TVPS 800G':800,'CAS V 300G':300,
  'CAS V+O 300G':300,'TV MOLD 800G':800,'TOPS 800G':800,'TCPS 800G':800,'BV 5KG':5000,
  'BB 5X60DLF':300,'TVPS 4KG':4000,'TV MOLD 4KG':4000,'TV+O 4KG':4000,'TV+C 4KG':4000,
};

let records = [];
let editIdx = null;

window.addEventListener('load', () => {
  document.getElementById('f_data').value = new Date().toISOString().split('T')[0];
});

function onArticolChange() { checkPH(); checkGreutate(); }

function checkPH() {
  const articol = document.getElementById('f_articol').value;
  const ph = parseFloat(document.getElementById('f_ph').value);
  const el = document.getElementById('ph_status');
  const inp = document.getElementById('f_ph');
  if (!articol || isNaN(ph)) { el.textContent=''; inp.classList.remove('ok','bad'); return; }
  const std = PH_STANDARDE[articol];
  if (!std) { el.textContent='Standard nedefinit'; el.className='ph-status'; return; }
  const ok = ph >= std[0] && ph <= std[1];
  el.textContent = (ok?'✓ OK ':'✗ NOK ') + '(std: '+std[0]+'–'+std[1]+')';
  el.className = 'ph-status ' + (ok?'ph-ok':'ph-bad');
  inp.classList.toggle('ok', ok);
  inp.classList.toggle('bad', !ok);
}

function checkGreutate() {
  const articol = document.getElementById('f_articol').value;
  const gr = parseFloat(document.getElementById('f_greutate').value);
  const el = document.getElementById('gr_info');
  const inp = document.getElementById('f_greutate');
  if (!articol || isNaN(gr)) { el.textContent=''; inp.classList.remove('ok','bad'); return; }
  const std = GREUTATI[articol];
  if (!std) { el.textContent='Standard nedefinit'; return; }
  const min = Math.round(std*0.95), max = Math.round(std*1.05);
  const ok = gr >= min && gr <= max;
  el.textContent = (ok?'✓ OK ':'✗ NOK ') + '(std: '+std+'g ±5% → '+min+'–'+max+'g)';
  el.className = 'gr-info ' + (ok?'ph-ok':'ph-bad');
  inp.classList.toggle('ok', ok);
  inp.classList.toggle('bad', !ok);
}

function getConformitate() {
  const articol = document.getElementById('f_articol').value;
  const ph = parseFloat(document.getElementById('f_ph').value);
  const gr = parseFloat(document.getElementById('f_greutate').value);
  const phStd = PH_STANDARDE[articol];
  const grStd = GREUTATI[articol];
  let phOk = null, grOk = null;
  if (phStd && !isNaN(ph)) phOk = ph >= phStd[0] && ph <= phStd[1];
  if (grStd && !isNaN(gr)) { const min=grStd*0.95, max=grStd*1.05; grOk = gr>=min && gr<=max; }
  if (phOk===false || grOk===false) return 'NECONFORM';
  if (phOk===true || grOk===true) return 'CONFORM';
  return 'N/A';
}

function getPHConf() {
  const articol = document.getElementById('f_articol').value;
  const ph = parseFloat(document.getElementById('f_ph').value);
  const std = PH_STANDARDE[articol];
  if (!std || isNaN(ph)) return 'N/A';
  return (ph >= std[0] && ph <= std[1]) ? 'OK' : 'NOK';
}

function getGrConf() {
  const articol = document.getElementById('f_articol').value;
  const gr = parseFloat(document.getElementById('f_greutate').value);
  const std = GREUTATI[articol];
  if (!std || isNaN(gr)) return 'N/A';
  return (gr >= std*0.95 && gr <= std*1.05) ? 'OK' : 'NOK';
}

function adaugaContraproba() {
  const articol = document.getElementById('f_articol').value;
  const lot     = document.getElementById('f_lot').value.trim();
  const gr      = document.getElementById('f_greutate').value;
  if (!articol) { showToast('Selectați articolul!', 'err'); return; }
  if (!lot)     { showToast('Completați lotul!', 'err'); return; }
  if (!gr)      { showToast('Completați greutatea!', 'err'); return; }

  const rec = {
    timestamp:      new Date().toLocaleString('ro-RO'),
    data:           document.getElementById('f_data').value,
    articol,
    lot,
    data_expirare:  document.getElementById('f_exp').value,
    greutate:       gr,
    greutate_conf:  getGrConf(),
    textura:        document.getElementById('f_textura').value,
    miros:          document.getElementById('f_miros').value,
    gust:           document.getElementById('f_gust').value,
    ph:             document.getElementById('f_ph').value,
    ph_conf:        getPHConf(),
    observatii:     document.getElementById('f_obs').value,
    efectuat:       document.getElementById('f_efect').value,
    verificat:      document.getElementById('f_verif').value,
    conformitate:   getConformitate(),
    saved: false,
  };

  if (editIdx !== null) { records[editIdx] = rec; editIdx = null; }
  else records.push(rec);

  renderRegistru();
  resetForm();
  showToast('Contraproba adăugată!', 'ok');
}

function resetForm() {
  ['f_lot','f_exp','f_greutate','f_ph','f_textura','f_miros','f_gust','f_efect','f_verif','f_obs'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value=''; el.classList.remove('ok','bad'); }
  });
  document.getElementById('ph_status').textContent = '';
  document.getElementById('gr_info').textContent = '';
  editIdx = null;
}

function editRecord(i) {
  if (records[i].saved) { showToast('Înregistrarea salvată nu poate fi editată', 'err'); return; }
  editIdx = i;
  const r = records[i];
  document.getElementById('f_data').value     = r.data||'';
  document.getElementById('f_articol').value  = r.articol||'';
  document.getElementById('f_lot').value      = r.lot||'';
  document.getElementById('f_exp').value      = r.data_expirare||'';
  document.getElementById('f_greutate').value = r.greutate||'';
  document.getElementById('f_ph').value       = r.ph||'';
  document.getElementById('f_textura').value  = r.textura||'';
  document.getElementById('f_miros').value    = r.miros||'';
  document.getElementById('f_gust').value     = r.gust||'';
  document.getElementById('f_efect').value    = r.efectuat||'';
  document.getElementById('f_verif').value    = r.verificat||'';
  document.getElementById('f_obs').value      = r.observatii||'';
  checkPH(); checkGreutate();
  window.scrollTo(0,0);
  showToast('Editați contraproba, apoi apăsați "Adaugă"', '');
}

function deleteRecord(i) {
  if (records[i].saved) { showToast('Înregistrarea salvată nu poate fi ștearsă', 'err'); return; }
  records.splice(i,1);
  renderRegistru();
}

function renderRegistru() {
  const body = document.getElementById('registruBody');
  const count = document.getElementById('regCount');
  const unsaved = records.filter(r=>!r.saved).length;
  count.textContent = records.length+' înregistrări · '+(unsaved===0?'TOATE SALVATE ✓':unsaved+' nesalvate');

  if (!records.length) {
    body.innerHTML = '<div class="empty-state">Nicio contraproba adăugată încă.</div>';
    return;
  }

  body.innerHTML = records.map((r,i) => {
    const conf = r.conformitate;
    const confColor = conf==='CONFORM'?'var(--green)':conf==='NECONFORM'?'var(--red)':'var(--gray-4)';
    return `<div class="rec-card ${r.saved?'saved':'unsaved'}">
      <div class="rec-title">
        <strong>${r.articol}</strong>
        <span style="font-size:12px;color:var(--gray-4)">LOT: ${r.lot}</span>
        ${r.data_expirare?`<span style="font-size:11px;background:#EDE7F6;color:var(--purple-mid);padding:2px 8px;border-radius:20px">Exp: ${r.data_expirare}</span>`:''}
        <span style="font-size:11px;font-weight:700;color:${confColor};background:${conf==='CONFORM'?'#E8F5E9':conf==='NECONFORM'?'#FFEBEE':'#F5F5F5'};padding:2px 10px;border-radius:20px">${conf}</span>
        ${r.saved?'<span style="font-size:11px;background:#E8F5E9;color:#2E7D32;padding:2px 10px;border-radius:20px">✓ Salvat</span>':''}
      </div>
      <div class="rec-chips">
        <span class="chip ${r.greutate_conf==='OK'?'chip-ok':r.greutate_conf==='NOK'?'chip-bad':'chip-gray'}">⚖️ ${r.greutate||'—'}g ${r.greutate_conf==='OK'?'✓':r.greutate_conf==='NOK'?'✗':''}</span>
        ${r.textura?`<span class="chip chip-gray">Textură: ${r.textura}</span>`:''}
        ${r.miros?`<span class="chip chip-gray">Miros: ${r.miros}</span>`:''}
        ${r.gust?`<span class="chip chip-gray">Gust: ${r.gust}</span>`:''}
        ${r.ph?`<span class="chip ${r.ph_conf==='OK'?'chip-ok':r.ph_conf==='NOK'?'chip-bad':'chip-gray'}">pH: ${r.ph} ${r.ph_conf==='OK'?'✓':r.ph_conf==='NOK'?'✗':''}</span>`:''}
      </div>
      <div class="rec-meta">${r.data} · ${r.efectuat||'—'}</div>
      ${r.observatii?`<div class="rec-obs">${r.observatii}</div>`:''}
      ${!r.saved?`<div class="rec-actions">
        <button class="btn-edit-rec" onclick="editRecord(${i})">✏️ Editează</button>
        <button class="btn-del-rec" onclick="deleteRecord(${i})">🗑 Șterge</button>
      </div>`:'<div style="font-size:12px;color:var(--gray-4);margin-top:8px;text-align:right">🔒 Blocat — salvat în Sheets</div>'}
    </div>`;
  }).join('');
}

async function salveazaInSheets() {
  const unsaved = records.filter(r=>!r.saved);
  if (!unsaved.length) { showToast('Toate contraprobele sunt deja salvate!', 'ok'); return; }

  const btn=document.getElementById('saveBtn');
  const txt=document.getElementById('saveTxt');
  const spin=document.getElementById('saveSpin');
  btn.disabled=true; txt.textContent='Se trimite...'; spin.classList.add('show');

  try {
    for (const r of unsaved) {
      const payload = {
        tip:'contraproba', timestamp:r.timestamp, data:r.data,
        articol:r.articol, lot:r.lot, data_expirare:r.data_expirare||'',
        greutate:r.greutate, greutate_conf:r.greutate_conf,
        textura:r.textura, miros:r.miros, gust:r.gust,
        ph:r.ph, ph_conf:r.ph_conf,
        observatii:r.observatii, efectuat:r.efectuat, verificat:r.verificat,
        conformitate:r.conformitate,
      };
      const resp = await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(payload)});
      const res  = await resp.json();
      if (res.status === 'success') r.saved = true;
      else throw new Error(res.message||'Eroare server');
    }
    renderRegistru();
    showToast('Salvat cu succes în Google Sheets! ✓', 'ok');
  } catch(e) {
    showToast('Eroare: '+e.message, 'err');
  } finally {
    btn.disabled=false; txt.textContent='📤 Salvează în Google Sheets'; spin.classList.remove('show');
  }
}

function exportExcel() {
  if (!records.length) { showToast('Nu există date de exportat', 'err'); return; }
  const ws_data = [
    ['Data','Articol','Lot','Data Expirare','Greutate(g)','Gr.Conf','Textura','Miros','Gust','pH','pH Conf','Observatii','Efectuat','Verificat','Conformitate'],
    ...records.map(r=>[r.data,r.articol,r.lot,r.data_expirare,r.greutate,r.greutate_conf,r.textura,r.miros,r.gust,r.ph,r.ph_conf,r.observatii,r.efectuat,r.verificat,r.conformitate])
  ];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb,ws,'Contraprobe');
  XLSX.writeFile(wb,'Contraprobe_'+new Date().toISOString().split('T')[0]+'.xlsx');
}

let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
