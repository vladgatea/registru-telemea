<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reclamații clienți – Ferma cu Omenie</title>
<style>
:root{
  --bg:#f5f4ef; --card:#fff; --ink:#1f2a22; --mut:#6b7468; --line:#e3e1d8;
  --acc:#2f5d3f; --acc2:#e8f0ea; --ok:#2e7d4f; --okbg:#e3f3e9; --wip:#b26a00; --wipbg:#fff1d9;
  --none:#8a8f88; --nonebg:#eeeeea; --err:#b3261e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px;font-weight:600}
header small{opacity:.8}
nav{display:flex;gap:4px;padding:0 12px;background:var(--acc);overflow-x:auto}
nav button{background:none;border:0;color:#cfe0d4;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
label b{color:var(--err)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.del{background:#fff;color:var(--err);border:1px solid var(--err)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hide{display:none!important}
/* combobox */
.combo{position:relative}
.combo ul{position:absolute;z-index:20;left:0;right:0;top:100%;margin:2px 0 0;padding:4px 0;list-style:none;background:#fff;border:1px solid var(--line);border-radius:7px;max-height:280px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.combo li{padding:7px 10px;cursor:pointer;display:flex;gap:8px}
.combo li .c{font-weight:600;min-width:96px;color:var(--acc)}
.combo li.act,.combo li:hover{background:var(--acc2)}
.combo li.empty{color:var(--mut);cursor:default}
/* status */
.st{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)} .st.wip{background:var(--wipbg);color:var(--wip)} .st.none{background:var(--nonebg);color:var(--none)}
.segs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.segs button{flex:1;border:0;background:#fff;padding:9px 6px;font:inherit;font-size:14px;cursor:pointer;color:var(--mut);border-right:1px solid var(--line)}
.segs button:last-child{border-right:0}
.segs button.on[data-v=""]{background:var(--nonebg);color:var(--ink);font-weight:600}
.segs button.on[data-v="În curs de rezolvare"]{background:var(--wipbg);color:var(--wip);font-weight:600}
.segs button.on[data-v="Rezolvată"]{background:var(--okbg);color:var(--ok);font-weight:600}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:#fafaf6;position:sticky;top:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#fafaf6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td select{padding:4px 6px;font-size:13px;width:auto}
.mut{color:var(--mut)} .sm{font-size:13px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:4px solid var(--acc)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--mut)}
.kpi.ok{border-top-color:var(--ok)} .kpi.wip{border-top-color:var(--wip)} .kpi.none{border-top-color:var(--none)}
.bar{height:8px;border-radius:4px;background:var(--acc2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:16px}
h2{font-size:16px;margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;max-width:90vw}
#toast.err{background:var(--err)}
#banner{background:#fff1d9;color:#7a4a00;padding:10px 16px;font-size:14px}
dialog{border:0;border-radius:12px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .bd{padding:16px;overflow:auto}
.loading{padding:30px;text-align:center;color:var(--mut)}
@media print{
  header,nav,.noprint,#banner{display:none!important}
  body{background:#fff;font-size:12px} main{padding:0;max-width:none}
  .card,.kpi{border:1px solid #ccc;break-inside:avoid} .tw{overflow:visible}
  th{position:static}
  section{display:none!important} section#t-raport{display:block!important}
  .printhead{display:block!important}
}
.printhead{display:none;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>Reclamații clienți</h1><small>Ferma cu Omenie</small></header>
<nav>
  <button data-t="nou" class="on">+ Reclamație nouă</button>
  <button data-t="lista">Listă reclamații</button>
  <button data-t="raport">Raport lunar</button>
</nav>
<div id="banner" class="hide"></div>
<main>
<div id="loading" class="loading">Se încarcă datele…</div>

<!-- ============ FORMULAR NOU ============ -->
<section id="t-nou" class="hide">
  <form id="fNou" class="card" autocomplete="off"></form>
</section>

<!-- ============ LISTA ============ -->
<section id="t-lista" class="hide">
  <div class="card noprint">
    <div class="grid">
      <div><label>Luna</label><select id="lLuna"></select></div>
      <div><label>Status</label><select id="lStatus">
        <option value="*">Toate</option><option value="">Fără status</option>
        <option>În curs de rezolvare</option><option>Rezolvată</option></select></div>
      <div><label>Caută (client, produs, lot…)</label><input id="lCauta" type="search"></div>
    </div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:8px"><span id="lCount" class="mut sm"></span><span class="sp"></span>
      <button class="btn sec" id="lReload" type="button">↻ Reîncarcă</button></div>
    <div class="tw"><table>
      <thead><tr><th>Data</th><th>Client</th><th>Produs</th><th>Lot</th><th>Problemă</th><th>Cant.</th><th>Status</th></tr></thead>
      <tbody id="lBody"></tbody>
    </table></div>
  </div>
</section>

<!-- ============ RAPORT ============ -->
<section id="t-raport" class="hide">
  <div class="card noprint">
    <div class="row">
      <div><label>Luna raportului</label><select id="rLuna"></select></div>
      <span class="sp"></span>
      <button class="btn sec" id="rCsv" type="button">⬇ Export Excel</button>
      <button class="btn" id="rPrint" type="button">🖨 Printează / PDF</button>
    </div>
  </div>
  <div class="printhead"><h2 id="rTitlu"></h2><div class="mut sm" id="rGen"></div></div>
  <div class="kpis" id="rKpi"></div>
  <div class="cols">
    <div class="card"><h2>Pe produs</h2><div class="tw" id="rProd"></div></div>
    <div class="card"><h2>Pe tip de problemă</h2><div class="tw" id="rProb"></div></div>
    <div class="card"><h2>Pe furnizor</h2><div class="tw" id="rFurn"></div></div>
    <div class="card"><h2>Evoluție pe luni</h2><div class="tw" id="rEvol"></div></div>
  </div>
  <div class="card"><h2>Reclamațiile lunii</h2><div class="tw" id="rLista"></div></div>
</section>
</main>

<dialog id="dlg">
  <div class="hd"><b id="dlgT">Editează reclamația</b><span class="sp"></span><button class="btn sec" type="button" onclick="dlg.close()">✕</button></div>
  <div class="bd"><form id="fEdit" autocomplete="off"></form></div>
</dialog>
<div id="toast" class="hide"></div>

<script>
/* ===================== CONFIG ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxHqQVU7qQW9yj-lgLO-V2fSVJYjV8dLjZdWIQF1bZo7RKxIWa50L3kYMYlOVzMduM4/exec';   // ex: https://script.google.com/macros/s/AKfy.../exec

const FURNIZORI = ['Ferma','Five Continents','Simultan','Lacto Sinelli','De Colțești','Arieșul Agricol'];
const STATUS = [['','Fără status'],['În curs de rezolvare','În curs'],['Rezolvată','Rezolvată']];
const LUNI = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
// rezervă, dacă foaia "Produse" nu răspunde
let PRODUSE = [{cod:'TVPS 375 G',nume:'Telemea de vacă puțin sărată 375g',furnizor:'Ferma'}];
let PROBLEME = ['Moale','Sfărâmicioasă','Apariție mucegai','Apariție drojdii','Capac umflat','Brânzită / acră','Fermentată','Gust acru','Devidată','Diferență de gramaj','Ambalaj deteriorat','Etichetare / lot / expirare','Termen scurt / expirat','Altele'];
let DATA = [];
const DEMO = !/^https:\/\/script\.google\.com\//.test(API_URL);

/* ===================== UTILS ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtD = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : '';
const lunaTxt = ym => LUNI[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const stCls = s => s==='Rezolvată'?'ok':s==='În curs de rezolvare'?'wip':'none';
const stTxt = s => (STATUS.find(x=>x[0]===s)||STATUS[0])[1];
const pill = s => `<span class="st ${stCls(s)}">${stTxt(s)}</span>`;
const store = { get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(t._h); t._h=setTimeout(()=>t.className='hide', err?6000:2500); }

/* ===================== API ===================== */
async function apiGet(){
  if (DEMO) return {ok:true, produse:PRODUSE, probleme:PROBLEME, reclamatii:DATA};
  const r = await fetch(API_URL+'?t='+Date.now()); const j = await r.json();
  if (!j.ok) throw new Error(j.error); return j;
}
async function apiPost(body){
  if (DEMO){ // mod demonstrativ – doar în memorie
    if (body.action==='add'){ const rec={...body.data,id:'R'+String(DATA.length+1).padStart(4,'0'),creatLa:today()}; return {ok:true,rec}; }
    if (body.action==='update'){ return {ok:true,rec:{...DATA.find(x=>x.id===body.data.id),...body.data}}; }
    return {ok:true,rec:{id:body.id}};
  }
  const r = await fetch(API_URL,{method:'POST',body:JSON.stringify(body)}); const j = await r.json();
  if (!j.ok) throw new Error(j.error); return j;
}
async function load(){
  try{
    const j = await apiGet();
    if (j.produse?.length) PRODUSE = j.produse;
    if (j.probleme?.length) PROBLEME = j.probleme;
    DATA = j.reclamatii || [];
  }catch(e){ toast('Nu s-au putut încărca datele: '+e.message, true); }
  $('#loading').classList.add('hide');
  buildForm($('#fNou'), null);
  fillMonths(); renderList(); renderReport();
  show(location.hash.slice(1)||'nou');
}

/* ===================== FORM ===================== */
function buildForm(form, rec){
  const r = rec || {data:today(), status:'', adaugatDe:store.get('rec_nume')};
  form.innerHTML = `
  <div class="grid">
    <div><label>Data <b>*</b></label><input type="date" name="data" required value="${esc(r.data)}"></div>
    <div class="full"><label>Produs reclamat <b>*</b> <span class="mut">(scrie codul sau numele, ex. „tvps 375”)</span></label>
      <div class="combo"><input name="produs" required placeholder="Caută produsul…" value="${esc(r.produs||'')}"><ul class="hide"></ul></div></div>
    <div><label>Furnizor</label><input name="furnizor" list="dlFurn" value="${esc(r.furnizor||'')}"></div>
    <div><label>Client</label><input name="client" list="dlClient" value="${esc(r.client||'')}"></div>
    <div><label>Lot / Expirare</label><input name="lot" value="${esc(r.lot||'')}" placeholder="ex. 26127071 / 12.07.2026"></div>
    <div><label>Cantitate reclamată</label><input name="cantitate" value="${esc(r.cantitate||'')}" placeholder="ex. 4 kg / 2 buc"></div>
    <div><label>Problema <b>*</b></label><select name="problema" required><option value="">— alege —</option>
      ${PROBLEME.map(p=>`<option ${p===r.problema?'selected':''}>${esc(p)}</option>`).join('')}
      ${r.problema && !PROBLEME.includes(r.problema)?`<option selected>${esc(r.problema)}</option>`:''}</select></div>
    <div><label>Detalii problemă</label><input name="detalii" value="${esc(r.detalii||'')}"></div>
    <div><label>Compensare</label><input name="compensare" value="${esc(r.compensare||'')}" placeholder="ex. retur, notă de credit, înlocuire"></div>
    <div><label>Observații</label><input name="observatii" value="${esc(r.observatii||'')}"></div>
    <div class="full"><label>Status reclamație</label>
      <div class="segs">${STATUS.map(([v,t])=>`<button type="button" data-v="${v}" class="${v===(r.status||'')?'on':''}">${t}</button>`).join('')}</div>
      <input type="hidden" name="status" value="${esc(r.status||'')}"></div>
    <div><label>Consemnat de</label><input name="adaugatDe" value="${esc(r.adaugatDe||'')}" placeholder="Numele tău"></div>
  </div>
  <div class="row" style="margin-top:16px">
    ${rec?`<button type="button" class="btn del" data-del>Șterge</button><span class="mut sm">${esc(rec.id)}${rec.creatLa?' · creat '+esc(rec.creatLa):''}${rec.modificatLa?' · modificat '+esc(rec.modificatLa):''}</span>`:''}
    <span class="sp"></span>
    <button class="btn" type="submit">${rec?'Salvează modificările':'Înregistrează reclamația'}</button>
  </div>`;
  form.dataset.id = rec ? rec.id : '';
  setupCombo(form.querySelector('.combo'), form);
  form.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{
    form.querySelectorAll('.segs button').forEach(x=>x.classList.toggle('on',x===b));
    form.status.value = b.dataset.v;
  });
  const del = form.querySelector('[data-del]');
  if (del) del.onclick = () => removeRec(rec.id);
  form.onsubmit = e => { e.preventDefault(); save(form); };
}

function setupCombo(box, form){
  const inp = box.querySelector('input'), ul = box.querySelector('ul');
  let act = -1, items = [];
  const label = p => p.nume;
  function open(){
    const toks = norm(inp.value).split(/\s+/).filter(Boolean);
    items = PRODUSE.filter(p => { const h = norm(p.cod+' '+p.nume); return toks.every(t=>h.includes(t)); });
    if (items.length===PRODUSE.length || !toks.length) items = PRODUSE;
    act = items.length ? 0 : -1;
    ul.innerHTML = items.length ? items.map((p,i)=>`<li data-i="${i}" class="${i===act?'act':''}"><span class="c">${esc(p.cod)}</span><span>${esc(p.nume)}</span></li>`).join('')
      : '<li class="empty">Niciun produs găsit</li>';
    ul.classList.remove('hide');
  }
  function pick(i){
    const p = items[i]; if (!p) return;
    inp.value = label(p); ul.classList.add('hide');
    if (!form.furnizor.value || FURNIZORI.includes(form.furnizor.value)) form.furnizor.value = p.furnizor || form.furnizor.value;
    inp.setCustomValidity('');
  }
  inp.addEventListener('focus', ()=>{ inp.select(); open(); });
  inp.addEventListener('input', open);
  inp.addEventListener('keydown', e=>{
    if (ul.classList.contains('hide')) return;
    if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); act=Math.max(0,Math.min(items.length-1,act+(e.key==='ArrowDown'?1:-1)));
      ul.querySelectorAll('li').forEach((l,i)=>l.classList.toggle('act',i===act)); ul.children[act]?.scrollIntoView({block:'nearest'}); }
    else if (e.key==='Enter'){ e.preventDefault(); pick(act); }
    else if (e.key==='Escape'){ ul.classList.add('hide'); }
  });
  ul.addEventListener('mousedown', e=>{ const li=e.target.closest('li[data-i]'); if(li){ e.preventDefault(); pick(+li.dataset.i); } });
  inp.addEventListener('blur', ()=>setTimeout(()=>{
    ul.classList.add('hide');
    const ok = PRODUSE.some(p=>label(p)===inp.value) || (form.dataset.id && inp.value === (DATA.find(x=>x.id===form.dataset.id)||{}).produs);
    inp.setCustomValidity(ok||!inp.value ? '' : 'Alege un produs din listă');
  },150));
}

async function save(form){
  const prodInp = form.produs;
  const ok = PRODUSE.some(p=>p.nume===prodInp.value) || (form.dataset.id && prodInp.value === (DATA.find(x=>x.id===form.dataset.id)||{}).produs);
  if (!ok){ prodInp.setCustomValidity('Alege un produs din listă'); prodInp.reportValidity(); return; }
  const d = Object.fromEntries(new FormData(form).entries());
  if (d.adaugatDe) store.set('rec_nume', d.adaugatDe);
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try{
    if (form.dataset.id){
      d.id = form.dataset.id;
      const j = await apiPost({action:'update', data:d});
      const i = DATA.findIndex(x=>x.id===d.id); DATA[i] = {...DATA[i], ...j.rec};
      dlg.close(); toast('Reclamația a fost actualizată');
    } else {
      const j = await apiPost({action:'add', data:d});
      DATA.push({...d, ...j.rec});
      toast('Reclamația '+j.rec.id+' a fost înregistrată');
      buildForm(form, null);
    }
    fillMonths(); renderList(); renderReport();
  }catch(e){ toast('Eroare la salvare: '+e.message, true); }
  btn.disabled = false;
}

async function quickStatus(id, status, sel){
  sel.disabled = true;
  try{
    const j = await apiPost({action:'update', data:{...DATA.find(x=>x.id===id), status}});
    const i = DATA.findIndex(x=>x.id===id); DATA[i] = {...DATA[i], ...j.rec};
    toast('Status actualizat'); renderReport();
  }catch(e){ toast('Eroare: '+e.message, true); }
  sel.disabled = false;
}

async function removeRec(id){
  if (!confirm('Ștergi definitiv reclamația '+id+'?')) return;
  try{ await apiPost({action:'delete', id}); DATA = DATA.filter(x=>x.id!==id); dlg.close(); toast('Reclamația a fost ștearsă');
       fillMonths(); renderList(); renderReport(); }
  catch(e){ toast('Eroare: '+e.message, true); }
}

/* ===================== LISTA ===================== */
function months(){
  const s = new Set(DATA.map(r=>r.data.slice(0,7)).filter(Boolean)); s.add(today().slice(0,7));
  return [...s].sort().reverse();
}
function fillMonths(){
  const ms = months();
  for (const [id, all] of [['#lLuna',true],['#rLuna',false]]){
    const sel = $(id), cur = sel.value;
    sel.innerHTML = (all?'<option value="*">Toate lunile</option>':'') + ms.map(m=>`<option value="${m}">${lunaTxt(m)}</option>`).join('');
    sel.value = cur && [...sel.options].some(o=>o.value===cur) ? cur : ms[0];
  }
  $('#dlClient') || document.body.insertAdjacentHTML('beforeend','<datalist id="dlClient"></datalist><datalist id="dlFurn"></datalist>');
  const cl = [...new Set(DATA.map(r=>r.client.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ro'));
  $('#dlClient').innerHTML = cl.map(c=>`<option value="${esc(c)}">`).join('');
  $('#dlFurn').innerHTML = FURNIZORI.map(c=>`<option value="${esc(c)}">`).join('');
}
function renderList(){
  const m = $('#lLuna').value, st = $('#lStatus').value, q = norm($('#lCauta').value).split(/\s+/).filter(Boolean);
  const rows = DATA.filter(r => (m==='*'||r.data.startsWith(m)) && (st==='*'||(r.status||'')===st)
      && q.every(t=>norm([r.client,r.produs,r.lot,r.problema,r.detalii,r.furnizor,r.id].join(' ')).includes(t)))
    .sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  $('#lCount').textContent = rows.length+' reclamații';
  $('#lBody').innerHTML = rows.map(r=>`<tr class="click" data-id="${esc(r.id)}">
    <td>${fmtD(r.data)}</td><td>${esc(r.client)||'<span class="mut">—</span>'}</td><td>${esc(r.produs)}</td>
    <td class="sm">${esc(r.lot)}</td><td>${esc(r.problema)}${r.detalii&&norm(r.detalii)!==norm(r.problema)?`<div class="mut sm">${esc(r.detalii)}</div>`:''}</td>
    <td class="sm">${esc(r.cantitate)}</td>
    <td><select data-st>${STATUS.map(([v,t])=>`<option value="${v}" ${v===(r.status||'')?'selected':''}>${t}</option>`).join('')}</select></td></tr>`).join('')
    || '<tr><td colspan="7" class="mut">Nicio reclamație.</td></tr>';
}
$('#lBody').addEventListener('click', e=>{
  if (e.target.closest('select')) return;
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const rec = DATA.find(x=>x.id===tr.dataset.id);
  $('#dlgT').textContent = 'Reclamația '+rec.id; buildForm($('#fEdit'), rec); dlg.showModal();
});
$('#lBody').addEventListener('change', e=>{
  const s = e.target.closest('select[data-st]'); if (s) quickStatus(s.closest('tr').dataset.id, s.value, s);
});
['#lLuna','#lStatus'].forEach(id=>$(id).addEventListener('change',renderList));
$('#lCauta').addEventListener('input',renderList);
$('#lReload').onclick = async ()=>{ $('#lReload').disabled=true; await reload(); $('#lReload').disabled=false; };
async function reload(){ try{ const j=await apiGet(); DATA=j.reclamatii||[]; if(j.produse?.length) PRODUSE=j.produse; fillMonths(); renderList(); renderReport(); toast('Date actualizate'); }catch(e){ toast('Eroare: '+e.message,true); } }

/* ===================== RAPORT ===================== */
function counts(rows, key){
  const m = new Map();
  rows.forEach(r=>{ const k=r[key]||'(necompletat)'; const o=m.get(k)||{t:0,ok:0,wip:0,none:0}; o.t++; o[stCls(r.status)]++; m.set(k,o); });
  return [...m.entries()].sort((a,b)=>b[1].t-a[1].t||a[0].localeCompare(b[0],'ro'));
}
function tbl(entries, total, head){
  const max = Math.max(1,...entries.map(e=>e[1].t));
  return `<table><thead><tr><th>${head}</th><th class="n">Total</th><th class="n">%</th><th class="n" title="Rezolvate">Rez.</th><th class="n" title="În curs">Curs</th><th class="n" title="Fără status">Fără</th><th class="noprint"></th></tr></thead><tbody>`+
    entries.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="n"><b>${o.t}</b></td><td class="n">${total?Math.round(o.t*100/total):0}%</td>
      <td class="n">${o.ok||''}</td><td class="n">${o.wip||''}</td><td class="n">${o.none||''}</td>
      <td class="noprint" style="width:18%"><div class="bar"><i style="width:${o.t*100/max}%"></i></div></td></tr>`).join('')+'</tbody></table>';
}
function renderReport(){
  const m = $('#rLuna').value; if (!m) return;
  const rows = DATA.filter(r=>r.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data));
  const n = rows.length, ok = rows.filter(r=>r.status==='Rezolvată').length,
        wip = rows.filter(r=>r.status==='În curs de rezolvare').length, none = n-ok-wip;
  const pct = v => n ? Math.round(v*100/n)+'%' : '–';
  $('#rTitlu').textContent = 'Raport reclamații – '+lunaTxt(m);
  $('#rGen').textContent = 'Ferma cu Omenie · generat '+fmtD(today());
  $('#rKpi').innerHTML = `
    <div class="kpi"><div class="v">${n}</div><div class="l">Total reclamații · ${lunaTxt(m)}</div></div>
    <div class="kpi ok"><div class="v">${ok}</div><div class="l">Soluționate · ${pct(ok)}</div></div>
    <div class="kpi wip"><div class="v">${wip}</div><div class="l">În curs de soluționare · ${pct(wip)}</div></div>
    <div class="kpi none"><div class="v">${none}</div><div class="l">Fără status completat · ${pct(none)}</div></div>`;
  $('#rProd').innerHTML = tbl(counts(rows,'produs'), n, 'Produs');
  $('#rProb').innerHTML = tbl(counts(rows,'problema'), n, 'Problemă');
  $('#rFurn').innerHTML = tbl(counts(rows,'furnizor'), n, 'Furnizor');
  const yr = m.slice(0,4);
  const ev = counts(DATA.filter(r=>r.data.startsWith(yr)).map(r=>({...r,luna:r.data.slice(0,7)})),'luna').sort((a,b)=>a[0].localeCompare(b[0]));
  $('#rEvol').innerHTML = tbl(ev.map(([k,o])=>[lunaTxt(k),o]), DATA.filter(r=>r.data.startsWith(yr)).length, 'Luna '+yr);
  $('#rLista').innerHTML = `<table><thead><tr><th>Data</th><th>Client</th><th>Produs</th><th>Lot</th><th>Problemă</th><th>Cant.</th><th>Compensare</th><th>Status</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${fmtD(r.data)}</td><td>${esc(r.client)}</td><td>${esc(r.produs)}</td><td class="sm">${esc(r.lot)}</td><td>${esc(r.problema)}</td><td class="sm">${esc(r.cantitate)}</td><td class="sm">${esc(r.compensare)}</td><td>${pill(r.status)}</td></tr>`).join('')+
    (n?'':'<tr><td colspan="8" class="mut">Nicio reclamație în această lună.</td></tr>')+'</tbody></table>';
}
$('#rLuna').addEventListener('change', renderReport);
$('#rPrint').onclick = ()=>window.print();
$('#rCsv').onclick = ()=>{
  const m = $('#rLuna').value;
  const rows = DATA.filter(r=>r.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data));
  const H = ['ID','Data','Furnizor','Client','Produs','Lot / Expirare','Cantitate','Problema','Detalii','Compensare','Observatii','Status','Consemnat de'];
  const K = ['id','data','furnizor','client','produs','lot','cantitate','problema','detalii','compensare','observatii','status','adaugatDe'];
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = [H.map(q).join(';'), ...rows.map(r=>K.map(k=>q(k==='data'?fmtD(r[k]):k==='status'?stTxt(r[k]):r[k])).join(';'))];
  const ok=rows.filter(r=>r.status==='Rezolvată').length, wip=rows.filter(r=>r.status==='În curs de rezolvare').length;
  lines.push('', q('Total')+';'+rows.length, q('Soluționate')+';'+ok, q('În curs')+';'+wip, q('Fără status')+';'+(rows.length-ok-wip));
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Reclamatii_'+m+'.csv'; a.click();
};

/* ===================== NAV ===================== */
function show(t){
  if (!['nou','lista','raport'].includes(t)) t='nou';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!=='t-'+t));
  history.replaceState(null,'','#'+t);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
const dlg = $('#dlg');
if (DEMO){ const b=$('#banner'); b.textContent='Mod demonstrativ: API_URL nu este configurat, datele nu se salvează. Pune URL-ul Apps Script în constanta API_URL.'; b.classList.remove('hide'); }
load();
</script>
