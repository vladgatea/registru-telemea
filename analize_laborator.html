<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analize Laborator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1B5E20;--green-mid:#2E7D32;--green-light:#43A047;--green-bg:#E8F5E9;--green-bg2:#F1F8E9;
  --red:#B71C1C;--red-mid:#C62828;--red-bg:#FFEBEE;
  --orange:#E65100;--orange-bg:#FFF3E0;
  --blue:#1565C0;--blue-bg:#E3F2FD;
  --gray-1:#F7F8FA;--gray-2:#ECEEF2;--gray-3:#C8CDD6;--gray-4:#7A8494;--gray-5:#3D4452;
  --dark:#1A1D23;--white:#FFFFFF;
  --radius:10px;--shadow:0 2px 10px rgba(0,0,0,0.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-1);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.hdr{background:var(--green-mid);color:white;padding:14px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.hdr-row{display:flex;align-items:center;gap:12px}
.hdr-icon{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr-title{font-size:16px;font-weight:700;flex:1}
.hdr-sub{font-size:11px;opacity:0.75;margin-top:1px}
.hdr-status{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#81C784}
.hdr-btns{display:flex;gap:8px;margin-top:10px}
.hdr-btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.hdr-btn.white{background:white;color:var(--green-mid)}
.hdr-btn.outline{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3)}

/* MAIN */
.main{padding:16px;max-width:900px;margin:0 auto}

/* FORM CARD */
.card{background:white;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-hdr{padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;gap:8px}
.card-hdr.green{background:var(--green-bg2);color:var(--green-mid)}
.card-body{padding:14px 16px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;color:var(--gray-4);text-transform:uppercase;letter-spacing:0.4px}
.field .std{font-size:10px;color:var(--gray-3);margin-top:2px}
.field input,.field select{width:100%;padding:9px 11px;border:1.5px solid var(--gray-2);border-radius:8px;font-size:15px;color:var(--dark);background:var(--gray-1);outline:none;appearance:none;-webkit-appearance:none;transition:all 0.2s}
.field input:focus,.field select:focus{border-color:var(--green-mid);background:white;box-shadow:0 0 0 3px rgba(46,125,50,0.1)}
.field input.ok{border-color:var(--green-light);background:#F1F8E9}
.field input.warn{border-color:#FFA000;background:#FFFDE7}
.field input.bad{border-color:var(--red-mid);background:var(--red-bg)}

/* NOTA AUTO */
.nota-banner{border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;font-weight:700}
.nota-banner.A{background:#E8F5E9;border:2px solid #4CAF50;color:#2E7D32}
.nota-banner.B{background:#FFFDE7;border:2px solid #FFC107;color:#F57F17}
.nota-banner.C{background:#FFF3E0;border:2px solid #FF9800;color:#E65100}
.nota-banner.D{background:#FFEBEE;border:2px solid #F44336;color:#C62828}
.nota-banner.empty{background:var(--gray-2);border:2px solid var(--gray-3);color:var(--gray-4)}
.nota-big{font-size:28px;font-weight:900;min-width:36px;text-align:center}
.nota-text{flex:1;font-size:13px}

/* SELECT WRAP */
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--gray-4);pointer-events:none;font-size:13px}
select{padding-right:30px;cursor:pointer}

/* ACTION BTNS */
.action-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{padding:12px 18px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all 0.2s;white-space:nowrap}
.btn-green{background:var(--green-mid);color:white}
.btn-green:hover{background:var(--green-light)}
.btn-green:disabled{background:var(--gray-3);cursor:not-allowed}
.btn-gray{background:var(--gray-2);color:var(--gray-5)}
.btn-gray:hover{background:var(--gray-3)}
.btn-orange{background:var(--orange);color:white}
.btn-blue{background:var(--blue);color:white}

/* SPINNER */
.spinner{width:16px;height:16px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* REGISTRU */
.reg-table{width:100%;border-collapse:collapse;font-size:12px}
.reg-table th{padding:8px 10px;background:var(--green-mid);color:white;font-weight:700;text-align:center;white-space:nowrap;font-size:11px}
.reg-table td{padding:7px 10px;border-bottom:1px solid var(--gray-2);text-align:center;vertical-align:middle}
.reg-table tr:last-child td{border-bottom:none}
.reg-table tr:hover td{background:var(--green-bg2)}
.nota-chip{display:inline-block;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:900;line-height:24px;text-align:center}
.nota-A{background:#E8F5E9;color:#2E7D32}
.nota-B{background:#FFFDE7;color:#F57F17}
.nota-C{background:#FFF3E0;color:#E65100}
.nota-D{background:#FFEBEE;color:#C62828}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-saved{background:#E8F5E9;color:#2E7D32}
.badge-unsaved{background:#FFF3E0;color:#E65100}

.btn-icon-sm{padding:4px 8px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.btn-edit-sm{background:var(--blue-bg);color:var(--blue)}
.btn-del-sm{background:var(--red-bg);color:var(--red-mid)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:white;padding:11px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 4px 20px rgba(0,0,0,0.25);max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-mid)}
.toast.err{background:var(--red-mid)}

.bottom-spacer{height:60px}
.empty-state{padding:30px;text-align:center;color:var(--gray-4);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="hdr-icon">🔬</div>
    <div style="flex:1">
      <div class="hdr-title">Analize Laborator</div>
      <div class="hdr-sub">Registru zilnic · 2026</div>
    </div>
    <div class="hdr-status"><div class="dot"></div><span id="statusTxt">Google Sheets conectat ✓</span></div>
  </div>
  <div class="hdr-btns">
    <button class="hdr-btn white" onclick="exportExcel()">📊 Excel</button>
    <button class="hdr-btn outline" onclick="window.print()">🖨 Print</button>
  </div>
</div>

<div class="main">

  <!-- ANALIZĂ NOUĂ -->
  <div class="card">
    <div class="card-hdr green">+ ANALIZĂ NOUĂ</div>
    <div class="card-body">

      <div class="grid-3" style="margin-bottom:12px">
        <div class="field">
          <label>Data</label>
          <input type="date" id="f_data" />
        </div>
        <div class="field">
          <label>Produs <span style="color:red">*</span></label>
          <div class="select-wrap">
            <select id="f_produs" onchange="onProdusChange()">
              <option value="">— Selectează produsul —</option>
              <option>TVPS 4-8kg</option><option>TV 4-8kg</option><option>TC 4-8kg</option>
              <option>TO 4-8kg</option><option>Cas de vaca rotund</option><option>Cas de vaca mp</option>
              <option>Cas de oaie mp</option><option>BB DLF</option><option>BB PDA</option>
              <option>Branza de vaci</option><option>Tops</option><option>Tcps</option>
              <option>TV DEG 4kg</option><option>Cas de vaca materie prima</option>
              <option>Telemea proaspata de vaca</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Lot</label>
          <input type="text" id="f_lot" placeholder="ex: 2600501" />
        </div>
      </div>

      <!-- NOTA AUTO -->
      <div class="nota-banner empty" id="notaBanner">
        <div class="nota-big" id="notaBig">—</div>
        <div class="nota-text" id="notaText">Introduceți parametrii pentru calculul automat al notei</div>
      </div>

      <!-- PARAMETRI -->
      <div style="font-size:11px;font-weight:700;color:var(--gray-4);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-2);">PARAMETRI FIZICO-CHIMICI</div>
      <div class="grid-4" style="margin-bottom:12px">
        <div class="field">
          <label>Aciditate (°Th)</label>
          <input type="number" id="f_acid" placeholder="—" step="0.1" oninput="calcNota()" />
          <div class="std" id="std_acid"></div>
        </div>
        <div class="field">
          <label>Sare (%)</label>
          <input type="number" id="f_sare" placeholder="—" step="0.01" oninput="calcNota()" />
          <div class="std" id="std_sare"></div>
        </div>
        <div class="field">
          <label>PH</label>
          <input type="number" id="f_ph" placeholder="—" step="0.01" oninput="calcNota()" />
          <div class="std" id="std_ph"></div>
        </div>
        <div class="field">
          <label>Temperatură (°C)</label>
          <input type="number" id="f_temp" placeholder="—" step="0.1" oninput="calcNota()" />
          <div class="std" id="std_temp"></div>
        </div>
        <div class="field">
          <label>SU (%)</label>
          <input type="number" id="f_su" placeholder="—" step="0.01" oninput="calcNota()" />
          <div class="std" id="std_su"></div>
        </div>
        <div class="field">
          <label>GB / Grăsime (%)</label>
          <input type="number" id="f_gb" placeholder="—" step="0.01" oninput="calcNota()" />
          <div class="std" id="std_gb"></div>
        </div>
        <div class="field">
          <label>G/SU (%)</label>
          <input type="number" id="f_gsu" placeholder="—" step="0.01" oninput="calcNota()" />
          <div class="std" id="std_gsu"></div>
        </div>
        <div class="field">
          <label>E-Coli</label>
          <div class="select-wrap">
            <select id="f_ecoli" onchange="calcNota()">
              <option value="">—</option>
              <option value="<100">&lt;100</option>
              <option value=">100">&gt;100</option>
            </select>
          </div>
        </div>
      </div>

      <div style="font-size:11px;font-weight:700;color:var(--gray-4);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-2);">DATE SUPLIMENTARE</div>
      <div class="grid-3" style="margin-bottom:12px">
        <div class="field"><label>D/M</label><input type="text" id="f_dm" placeholder="ex: &lt;100" /></div>
        <div class="field"><label>Organoleptic</label><input type="text" id="f_org" placeholder="ex: CP" /></div>
        <div class="field"><label>Acid Lactic</label><input type="text" id="f_alactic" placeholder="ex: 1200ML" /></div>
        <div class="field"><label>Efectuat</label><input type="text" id="f_efect" placeholder="Nume laborant" /></div>
        <div class="field"><label>Verificat</label><input type="text" id="f_verif" placeholder="Nume verificator" /></div>
      </div>

    </div>
  </div>

  <!-- ACTIUNI -->
  <div class="action-bar">
    <button class="btn btn-gray" onclick="stergeFormular()">🗑 Șterge formular</button>
    <button class="btn btn-orange" onclick="exportExcel()">📊 Export Excel</button>
    <button class="btn btn-gray" onclick="window.print()">🖨 Printează</button>
    <button class="btn btn-green" id="saveBtn" onclick="adaugaInRegistru()">
      <span id="saveTxt">✚ Adaugă analiză în registru</span>
      <div class="spinner" id="saveSpin"></div>
    </button>
  </div>

  <!-- REGISTRU -->
  <div class="card">
    <div class="card-hdr green" style="justify-content:space-between">
      <span>📋 REGISTRU ANALIZE</span>
      <button class="btn btn-green" id="sendBtn" onclick="salveazaInSheets()" style="padding:6px 14px;font-size:12px;">
        <span id="sendTxt">📤 Salvează în Google Sheets</span>
        <div class="spinner" id="sendSpin"></div>
      </button>
    </div>
    <div class="card-body" style="padding:0;overflow-x:auto">
      <div id="registruWrap">
        <div class="empty-state">Nicio analiză adăugată încă. Completați formularul de mai sus.</div>
      </div>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSi7JpF6q0LPK1zP3ue3slKze92dksT-lKM63SwKrMs8gQI953bsOcsCKqPwB2xWqY/exec';

const STANDARDE = {
  'TVPS 4-8kg':     {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'TV 4-8kg':       {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'TC 4-8kg':       {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'TO 4-8kg':       {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'Cas de vaca rotund':{aciditate:[150,210],ph:[5.3,5.5],temp:[0,14],su_min:48,su_max:50,grasime:44,gsu_min:44,gsu_max:45},
  'Cas de vaca mp': {aciditate:[150,210],ph:[5.3,5.5],temp:[0,14],su_min:48,su_max:50,grasime:44,gsu_min:44,gsu_max:45},
  'Cas de oaie mp': {aciditate:[160,220],ph:[5.1,5.4],temp:[0,14],su_min:48,su_max:50,grasime:47,gsu_min:47,gsu_max:48},
  'BB DLF':         {aciditate:[180,240],ph:[4.5,4.9],temp:[0,14],su_min:44,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'BB PDA':         {aciditate:[180,240],ph:[4.5,4.9],temp:[0,14],su_min:44,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'Branza de vaci': {aciditate:[180,240],ph:[4.5,4.6],temp:[0,14],su_min:34,su_max:null,grasime:null,gsu_min:null,gsu_max:null},
  'Tops':           {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'Tcps':           {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:45,gsu_min:null,gsu_max:null},
  'TV DEG 4kg':     {aciditate:[170,220],ph:[4.6,4.9],temp:[0,14],su_min:46,su_max:null,grasime:null,gsu_min:null,gsu_max:null},
  'Cas de vaca materie prima':{aciditate:[120,190],ph:[5.3,5.5],temp:[0,14],su_min:null,su_max:null,grasime:null,gsu_min:null,gsu_max:null},
  'Telemea proaspata de vaca':{aciditate:null,ph:[6.2,6.5],temp:[8,8],su_min:30,su_max:null,grasime:11,gsu_min:38,gsu_max:null,ecoli_max:100},
};

let records = [];
let editingIdx = null;

window.addEventListener('load', () => {
  document.getElementById('f_data').value = new Date().toISOString().split('T')[0];
});

function onProdusChange() {
  const produs = document.getElementById('f_produs').value;
  const std = STANDARDE[produs];
  const defs = [
    {id:'std_acid', v: std?.aciditate ? std.aciditate[0]+'-'+std.aciditate[1]+' °Th' : ''},
    {id:'std_ph',   v: std?.ph   ? std.ph[0]+'-'+std.ph[1] : ''},
    {id:'std_temp', v: std?.temp ? (std.temp[0]===std.temp[1] ? std.temp[0]+'°C' : std.temp[0]+'-'+std.temp[1]+'°C') : '13-14°C'},
    {id:'std_su',   v: std?.su_min ? (std.su_max ? std.su_min+'-'+std.su_max+'%' : 'min. '+std.su_min+'%') : ''},
    {id:'std_gb',   v: std?.grasime ? 'min. '+std.grasime+'%' : ''},
    {id:'std_gsu',  v: std?.gsu_min ? (std.gsu_max ? std.gsu_min+'-'+std.gsu_max+'%' : 'min. '+std.gsu_min+'%') : ''},
    {id:'std_sare', v: ''},
  ];
  defs.forEach(d => { const el=document.getElementById(d.id); if(el) el.textContent = d.v; });
  calcNota();
}

function getAbatere(val, min, max) {
  if (val === null || val === undefined || isNaN(val)) return null;
  if (min !== null && min !== undefined && val < min) return (min - val) / min;
  if (max !== null && max !== undefined && val > max) return (val - max) / max;
  return 0;
}

function calcNota() {
  const produs = document.getElementById('f_produs').value;
  const std = STANDARDE[produs];
  const banner = document.getElementById('notaBanner');
  const big = document.getElementById('notaBig');
  const txt = document.getElementById('notaText');

  if (!std) {
    banner.className = 'nota-banner empty';
    big.textContent = '—'; txt.textContent = 'Selectați produsul pentru calcul automat';
    return;
  }

  const vals = {
    aciditate: parseFloat(document.getElementById('f_acid').value),
    ph:        parseFloat(document.getElementById('f_ph').value),
    temp:      parseFloat(document.getElementById('f_temp').value),
    su:        parseFloat(document.getElementById('f_su').value),
    gb:        parseFloat(document.getElementById('f_gb').value),
    gsu:       parseFloat(document.getElementById('f_gsu').value),
  };
  const ecoli = document.getElementById('f_ecoli').value;

  // E-Coli >100 = D automat
  if (ecoli === '>100') {
    banner.className = 'nota-banner D';
    big.textContent = 'D'; txt.textContent = 'E-Coli >100 — Nota D automată';
    colorFields(std, vals);
    return;
  }

  const checks = [
    {key:'aciditate', min:std.aciditate?.[0], max:std.aciditate?.[1]},
    {key:'ph',        min:std.ph?.[0],         max:std.ph?.[1]},
    {key:'temp',      min:std.temp?.[0],        max:std.temp?.[1]},
    {key:'su',        min:std.su_min,           max:std.su_max},
    {key:'gb',        min:std.grasime,          max:null},
    {key:'gsu',       min:std.gsu_min,          max:std.gsu_max},
  ];

  let maxAbatere = 0, nrDepasiti = 0, detalii = [];
  let hasAnyValue = false;

  checks.forEach(c => {
    const v = vals[c.key];
    if (isNaN(v)) return;
    hasAnyValue = true;
    const ab = getAbatere(v, c.min ?? null, c.max ?? null);
    if (ab === null) return;
    if (ab > 0) { nrDepasiti++; detalii.push(c.key+': '+((ab*100).toFixed(1))+'%'); }
    if (ab > maxAbatere) maxAbatere = ab;
  });

  if (!hasAnyValue) {
    banner.className = 'nota-banner empty';
    big.textContent = '—'; txt.textContent = 'Introduceți parametrii pentru calcul';
    colorFields(std, vals);
    return;
  }

  let nota, cls, motiv;
  if (nrDepasiti === 0) { nota='A'; cls='A'; motiv='Toți parametrii în standard ✓'; }
  else if (nrDepasiti === 1 && maxAbatere <= 0.05) { nota='B'; cls='B'; motiv='1 parametru ușor depășit (≤5%): '+detalii.join(', '); }
  else if ((nrDepasiti === 1 && maxAbatere > 0.05) || nrDepasiti === 2) { nota='C'; cls='C'; motiv='Abatere semnificativă: '+detalii.join(', '); }
  else { nota='D'; cls='D'; motiv='3+ parametri depășiți sau abatere >15%: '+detalii.join(', '); }

  banner.className = 'nota-banner ' + cls;
  big.textContent = nota;
  txt.textContent = motiv;
  colorFields(std, vals);
}

function colorFields(std, vals) {
  const map = [
    {id:'f_acid', min:std.aciditate?.[0], max:std.aciditate?.[1], v:vals.aciditate},
    {id:'f_ph',   min:std.ph?.[0],         max:std.ph?.[1],        v:vals.ph},
    {id:'f_temp', min:std.temp?.[0],        max:std.temp?.[1],      v:vals.temp},
    {id:'f_su',   min:std.su_min,           max:std.su_max,         v:vals.su},
    {id:'f_gb',   min:std.grasime,          max:null,               v:vals.gb},
    {id:'f_gsu',  min:std.gsu_min,          max:std.gsu_max,        v:vals.gsu},
  ];
  map.forEach(m => {
    const el = document.getElementById(m.id);
    if (!el) return;
    el.classList.remove('ok','warn','bad');
    if (isNaN(m.v)) return;
    const ab = getAbatere(m.v, m.min??null, m.max??null);
    if (ab === 0) el.classList.add('ok');
    else if (ab <= 0.05) el.classList.add('warn');
    else el.classList.add('bad');
  });
}

function getNota() {
  const big = document.getElementById('notaBig').textContent;
  return ['A','B','C','D'].includes(big) ? big : '';
}

function getConformitate(nota) {
  if (nota === 'A' || nota === 'B') return 'CONFORM';
  if (nota === 'C') return 'PARTIAL (C)';
  if (nota === 'D') return 'NECONFORM';
  return '';
}

function adaugaInRegistru() {
  const produs = document.getElementById('f_produs').value;
  if (!produs) { showToast('Selectați produsul!', 'err'); return; }
  const nota = getNota();
  const rec = {
    timestamp: new Date().toLocaleString('ro-RO'),
    data:      document.getElementById('f_data').value,
    produs,
    lot:       document.getElementById('f_lot').value,
    nota,
    aciditate: document.getElementById('f_acid').value,
    sare:      document.getElementById('f_sare').value,
    ph:        document.getElementById('f_ph').value,
    temp:      document.getElementById('f_temp').value,
    su:        document.getElementById('f_su').value,
    gb:        document.getElementById('f_gb').value,
    gsu:       document.getElementById('f_gsu').value,
    ecoli:     document.getElementById('f_ecoli').value,
    dm:        document.getElementById('f_dm').value,
    organoleptic: document.getElementById('f_org').value,
    acid_lactic:  document.getElementById('f_alactic').value,
    efectuat:  document.getElementById('f_efect').value,
    verificat: document.getElementById('f_verif').value,
    conformitate: getConformitate(nota),
    saved: false,
  };
  if (editingIdx !== null) { records[editingIdx] = rec; editingIdx = null; }
  else records.push(rec);
  renderRegistru();
  stergeFormular();
  showToast('Analiză adăugată în registru!', 'ok');
}

function stergeFormular() {
  ['f_lot','f_acid','f_sare','f_ph','f_temp','f_su','f_gb','f_gsu','f_dm','f_org','f_alactic','f_efect','f_verif'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('ok','warn','bad'); }
  });
  document.getElementById('f_ecoli').value = '';
  document.getElementById('notaBanner').className = 'nota-banner empty';
  document.getElementById('notaBig').textContent = '—';
  document.getElementById('notaText').textContent = 'Introduceți parametrii pentru calculul automat al notei';
  ['std_acid','std_ph','std_temp','std_su','std_gb','std_gsu','std_sare'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = '';
  });
  editingIdx = null;
}

function editRecord(idx) {
  const r = records[idx];
  if (r.saved) { showToast('Analiza salvată nu poate fi editată', 'err'); return; }
  editingIdx = idx;
  document.getElementById('f_data').value  = r.data || '';
  document.getElementById('f_produs').value = r.produs || '';
  document.getElementById('f_lot').value    = r.lot || '';
  document.getElementById('f_acid').value   = r.aciditate || '';
  document.getElementById('f_sare').value   = r.sare || '';
  document.getElementById('f_ph').value     = r.ph || '';
  document.getElementById('f_temp').value   = r.temp || '';
  document.getElementById('f_su').value     = r.su || '';
  document.getElementById('f_gb').value     = r.gb || '';
  document.getElementById('f_gsu').value    = r.gsu || '';
  document.getElementById('f_ecoli').value  = r.ecoli || '';
  document.getElementById('f_dm').value     = r.dm || '';
  document.getElementById('f_org').value    = r.organoleptic || '';
  document.getElementById('f_alactic').value = r.acid_lactic || '';
  document.getElementById('f_efect').value  = r.efectuat || '';
  document.getElementById('f_verif').value  = r.verificat || '';
  onProdusChange();
  window.scrollTo(0, 0);
}

function deleteRecord(idx) {
  if (records[idx].saved) { showToast('Analiza salvată nu poate fi ștearsă', 'err'); return; }
  records.splice(idx, 1);
  renderRegistru();
}

function renderRegistru() {
  const wrap = document.getElementById('registruWrap');
  if (!records.length) {
    wrap.innerHTML = '<div class="empty-state">Nicio analiză adăugată încă.</div>';
    return;
  }
  wrap.innerHTML = `<table class="reg-table">
    <thead><tr>
      <th>Data</th><th>Produs</th><th>Lot</th><th>Notă</th>
      <th>Acid.</th><th>Sare</th><th>pH</th><th>Temp</th>
      <th>SU</th><th>GB</th><th>G/SU</th><th>E-Coli</th>
      <th>Efectuat</th><th>Conformitate</th><th>Status</th><th>Acțiuni</th>
    </tr></thead>
    <tbody>${records.map((r,i) => `
      <tr>
        <td>${r.data||''}</td>
        <td style="text-align:left;font-weight:600">${r.produs||''}</td>
        <td>${r.lot||''}</td>
        <td><span class="nota-chip nota-${r.nota||'D'}">${r.nota||'—'}</span></td>
        <td>${r.aciditate||'—'}</td><td>${r.sare||'—'}</td><td>${r.ph||'—'}</td><td>${r.temp||'—'}</td>
        <td>${r.su||'—'}</td><td>${r.gb||'—'}</td><td>${r.gsu||'—'}</td><td>${r.ecoli||'—'}</td>
        <td>${r.efectuat||'—'}</td>
        <td><span style="font-size:11px;font-weight:700;color:${r.conformitate==='CONFORM'?'#2E7D32':r.conformitate==='NECONFORM'?'#C62828':'#E65100'}">${r.conformitate||''}</span></td>
        <td><span class="badge ${r.saved?'badge-saved':'badge-unsaved'}">${r.saved?'Salvat':'Nesalvat'}</span></td>
        <td style="white-space:nowrap">
          ${!r.saved ? `<button class="btn-icon-sm btn-edit-sm" onclick="editRecord(${i})">✏️</button>
          <button class="btn-icon-sm btn-del-sm" onclick="deleteRecord(${i})">✕</button>` : '🔒'}
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

async function salveazaInSheets() {
  const unsaved = records.filter(r => !r.saved);
  if (!unsaved.length) { showToast('Toate analizele sunt deja salvate!', 'ok'); return; }

  const btn = document.getElementById('sendBtn');
  const txt = document.getElementById('sendTxt');
  const spin = document.getElementById('sendSpin');
  btn.disabled = true;
  txt.textContent = 'Se trimite...';
  spin.classList.add('show');

  const payload = {
    tip: 'analize',
    records: unsaved.map(r => ({
      timestamp: r.timestamp, data: r.data, produs: r.produs, lot: r.lot, nota: r.nota,
      aciditate: r.aciditate, sare: r.sare, ph: r.ph, temp: r.temp,
      su: r.su, gb: r.gb, gsu: r.gsu, ecoli: r.ecoli,
      dm: r.dm, organoleptic: r.organoleptic, acid_lactic: r.acid_lactic,
      efectuat: r.efectuat, verificat: r.verificat, conformitate: r.conformitate,
    }))
  };

  try {
    const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    const res = await resp.json();
    if (res.status === 'success') {
      records.forEach(r => { if (!r.saved) r.saved = true; });
      renderRegistru();
      showToast('Salvat cu succes în Google Sheets! ✓', 'ok');
    } else throw new Error(res.message || 'Eroare server');
  } catch(e) {
    showToast('Eroare: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    txt.textContent = '📤 Salvează în Google Sheets';
    spin.classList.remove('show');
  }
}

function exportExcel() {
  if (!records.length) { showToast('Nu există analize de exportat', 'err'); return; }
  const ws_data = [
    ['Data','Produs','Lot','Nota','Aciditate','Sare','pH','Temp','SU','GB','G/SU','E-Coli','D/M','Organoleptic','Acid Lactic','Efectuat','Verificat','Conformitate'],
    ...records.map(r => [r.data,r.produs,r.lot,r.nota,r.aciditate,r.sare,r.ph,r.temp,r.su,r.gb,r.gsu,r.ecoli,r.dm,r.organoleptic,r.acid_lactic,r.efectuat,r.verificat,r.conformitate])
  ];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb, ws, 'Analize');
  XLSX.writeFile(wb, 'Analize_Laborator_'+new Date().toISOString().split('T')[0]+'.xlsx');
}

let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
